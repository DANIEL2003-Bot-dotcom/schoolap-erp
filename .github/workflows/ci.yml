# Intégration continue : tests de l'API sur un vrai PostgreSQL + build du tableau de bord.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: schoolap
          POSTGRES_PASSWORD: schoolap
          POSTGRES_DB: schoolap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schoolap" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://schoolap:schoolap@localhost:5432/schoolap_test
      TEST_DATABASE_URL: postgresql://schoolap:schoolap@localhost:5432/schoolap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
