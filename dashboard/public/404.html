<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ERP Scolaire RDC — Redirection</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages : toute adresse inconnue renvoie vers l'application, qui affiche la connexion sans session valide.
      var base = '/' + (window.location.pathname.split('/')[1] || '') + '/';
      window.location.replace(base === '//' ? '/' : base);
    </script>
  </head>
  <body>
    <p>Redirection vers la page de connexion… <a href="./">Continuer</a></p>
  </body>
</html>
