name: ecole_mobile
description: "Application enseignant de l'ERP scolaire RDC : appel hors-ligne (sqflite), saisie rapide des cotes et synchronisation par file d'attente HTTP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.5
  path: ^1.9.1
  http: ^1.6.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
